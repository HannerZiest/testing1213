<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawing instrument</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #faf8f3; color: #2c2c2a; }
  #app { display: flex; gap: 16px; padding: 16px; box-sizing: border-box; height: 100vh; }
  aside { width: 156px; flex: none; display: flex; flex-direction: column; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 44px); gap: 8px; }
  .tool { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ddd; background: #fff; font-size: 10px; cursor: pointer; padding: 0; color: #2c2c2a; }
  .tool:hover { background: #f1efe8; }
  .tool.on { background: #2c2c2a; color: #fff; border-color: #2c2c2a; }
  .tool.big { font-size: 18px; }
  .sw { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; padding: 0; }
  .sw.on { outline: 3px solid #2c2c2a; outline-offset: 3px; }
  #instName { font-size: 13px; color: #666; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
  header button, header select { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
  header label { font-size: 13px; color: #666; display: flex; gap: 6px; align-items: center; }
  header input[type=range] { width: 90px; }
  #play { min-width: 70px; font-weight: 500; }
  #status { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 190px; }
  #wrap { flex: 1; position: relative; min-height: 360px; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 16px; border: 1px solid #e6e2d8; box-sizing: border-box; cursor: crosshair; touch-action: none; }
  #err { display: none; margin: 0 0 10px; padding: 10px 14px; border-radius: 8px; background: #fcebeb; color: #791f1f; font-size: 14px; }
  .hint { margin: 8px 2px 0; font-size: 12px; color: #999; }
</style>
<script>
  window.onerror = function (msg, src, line) {
    var e = document.getElementById('err');
    if (e) { e.style.display = 'block'; e.textContent = 'Something went wrong: ' + msg + ' (line ' + line + ')'; }
  };
</script>
</head>
<body>
<div id="app">
  <aside>
    <div class="grid3">
      <button class="tool on" id="tPen" title="Pen">Pen</button>
      <button class="tool" id="tErase" title="Eraser">Erase</button>
      <button class="tool" id="tMove" title="Move (or hold Space)">Move</button>
      <button class="tool" id="tUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="tool" id="tRedo" title="Redo (Ctrl+Y)">Redo</button>
      <button class="tool" id="tClear" title="Clear everything">Clear</button>
      <button class="tool big" id="tZoomIn" title="Zoom in">+</button>
      <button class="tool big" id="tZoomOut" title="Zoom out">-</button>
      <button class="tool" id="tFit" title="Show the whole song">Fit</button>
      <button class="tool" id="tShuffle" title="Surprise me">Shuffle</button>
      <button class="tool on" id="tGrid" title="Show grid">Grid</button>
    </div>
    <div class="grid3" id="palette"></div>
    <div id="instName"></div>
  </aside>
  <main>
    <div id="err"></div>
    <header>
      <button id="play">Play</button>
      <span id="status">Loading...</span>
      <label>Mood
        <select id="mood">
          <option value="calm">Calm</option>
          <option value="dreamy">Dreamy</option>
          <option value="warm">Warm</option>
        </select>
      </label>
      <label>Tempo <input type="range" id="tempo" min="56" max="110" step="1" value="76"> <span id="bpm">76</span></label>
      <label>Evolve <input type="range" id="evolve" min="0" max="80" step="1" value="30"></label>
      <label>Echo <input type="range" id="echo" min="0" max="55" step="1" value="30"></label>
      <label>Length
        <select id="len">
          <option value="60">1 min</option>
          <option value="120">2 min</option>
          <option value="180">3 min</option>
          <option value="300" selected>5 min</option>
          <option value="0">Endless</option>
        </select>
      </label>
      <label><input type="checkbox" id="backing" checked> Backing</label>
      <label><input type="checkbox" id="follow" checked> Follow</label>
      <button id="save">Save</button>
      <button id="load">Load</button>
      <button id="wav">Export WAV</button>
    </header>
    <div id="wrap"><canvas id="cv"></canvas></div>
    <p class="hint">Move around: pick Move (or hold Space) and drag. Mouse wheel zooms, Shift + wheel scrolls sideways. Draw further right to make the song longer; the dashed line marks where it loops.</p>
  </main>
</div>

<script>
window.addEventListener('load', function () {

var LO = 57, HI = 86, TOP = 24, PH = 18, BASE = 24;
var MOODS = {
  calm:   { root: 2, scale: [0, 3, 5, 7, 10], chords: [['Dm', [2, 5, 9]], ['Bb', [10, 2, 5]], ['F', [5, 9, 0]], ['C', [0, 4, 7]]] },
  dreamy: { root: 2, scale: [0, 2, 4, 7, 9],  chords: [['D', [2, 6, 9]], ['Bm', [11, 2, 6]], ['G', [7, 11, 2]], ['A', [9, 1, 4]]] },
  warm:   { root: 7, scale: [0, 2, 4, 7, 9],  chords: [['G', [7, 11, 2]], ['Em', [4, 7, 11]], ['C', [0, 4, 7]], ['D', [2, 6, 9]]] }
};
var INSTR = [
  { name: 'Marimba',   color: '#1D9E75', oct: 0,   play: marimba },
  { name: 'Pluck',     color: '#D85A30', oct: 0,   play: pluck },
  { name: 'Bell',      color: '#7F77DD', oct: 0,   play: bellTone },
  { name: 'Kalimba',   color: '#EF9F27', oct: 0,   play: kalimba },
  { name: 'Flute',     color: '#3B5BD9', oct: 0,   play: flute },
  { name: 'Glass',     color: '#D96BA8', oct: 0,   play: glass },
  { name: 'Music box', color: '#85B7EB', oct: 12,  play: musicBox },
  { name: 'Bass',      color: '#2C2C2A', oct: -12, play: bassTone },
  { name: 'E-piano',   color: '#F0B27A', oct: 0,   play: epiano }
];
function $(id) { return document.getElementById(id); }
var cv = $('cv'), ctx = cv.getContext('2d');
var layer = document.createElement('canvas'), lctx = layer.getContext('2d');

var mood = MOODS.calm, scalePitches = [], strokes = [], undoStack = [], redoStack = [], songN = 64;
var tool = 'pen', curColor = 2, showGrid = true, spaceDown = false;
var zoom = 1, camX = 0, camY = 0;
var bpm = 76, evolve = 30, echo = 30, lengthSec = 300, backing = true;
var ac = null, chain = null, playing = false, ended = false, timerId = null;
var nextTime = 0, schedStart = 0, pass = 0, step = 0, passSteps = 64, totalPasses = 1, curPass = null;
var queue = [], visStep = -1, visPass = 0, elapsed = 0, lastStatus = '';

function stepDur() { return 60 / bpm / 4; }
function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function pcOf(p) { return ((p % 12) + 12) % 12; }
function fmt(s) { return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
function strength(s) { return s % 16 === 0 ? 4 : s % 8 === 0 ? 3 : s % 4 === 0 ? 2 : s % 2 === 0 ? 1 : 0; }
function chordAt(s) { return mood.chords[Math.floor(s / 16) % 4][1]; }
function voice(pc, lo) { var m = lo; while (pcOf(m) !== pc) m++; return m; }
function pitchOfY(y) { return LO + (1 - y / PH) * (HI - LO); }
function calcSong() {
  var mx = 0;
  strokes.forEach(function (st) { st.pts.forEach(function (p) { if (p.x > mx) mx = p.x; }); });
  return Math.max(64, Math.ceil((mx + 1) / 16) * 16);
}
function passesFor(n) { return lengthSec ? Math.max(1, Math.round(lengthSec / (n * stepDur()))) : Infinity; }

function setMood(k) {
  mood = MOODS[k]; scalePitches = [];
  for (var p = LO - 7; p <= HI + 7; p++) if (mood.scale.indexOf(pcOf(p - mood.root)) >= 0) scalePitches.push(p);
  refresh();
}

/* ---------- turning drawings into notes ---------- */
function strokeTracks(n) {
  return strokes.map(function (st) {
    var sum = new Float64Array(n), cnt = new Uint16Array(n), first = -1;
    st.pts.forEach(function (pt) {
      var s = Math.floor(pt.x);
      if (s < 0 || s >= n) return;
      if (first < 0) first = s;
      sum[s] += pitchOfY(pt.y); cnt[s]++;
    });
    var y = [];
    for (var k = 0; k < n; k++) y.push(cnt[k] ? sum[k] / cnt[k] : NaN);
    return { y: y, first: first, c: st.c };
  });
}

function choose(target, s, prev) {
  var pcs = chordAt(s), wH = [0, 0.3, 0.7, 1.4, 2.2][strength(s)];
  var best = Math.round(target), bs = -1e9;
  for (var i = 0; i < scalePitches.length; i++) {
    var p = scalePitches[i];
    if (p < LO - 2 || p > HI + 2 || Math.abs(p - target) > 6) continue;
    var d = p - target, sc = -(d * d) / 5, pc = pcOf(p);
    if (pcs.indexOf(pc) >= 0) sc += wH;
    else if (pcs.some(function (c) { var iv = pcOf(pc - c); return iv === 1 || iv === 11 || iv === 6; })) sc -= wH * 0.8;
    if (prev !== null) { var l = Math.abs(p - prev); if (l > 7) sc -= 0.08 * (l - 7) * (l - 7); if (l === 0) sc -= 0.25; }
    sc += Math.random() * 0.35;
    if (sc > bs) { bs = sc; best = p; }
  }
  return best;
}

function layers(p, isLast) {
  if (!backing) return {};
  if (isLast) return { pad: 1, thin: 1 };
  return [{ pad: 1 }, { pad: 1, bass: 1 }, { pad: 1, bass: 1 }, { pad: 1, bass: 1, sparkle: 1 },
          { pad: 1, bass: 1, sparkle: 1 }, { pad: 1, thin: 1 }, { pad: 1, bass: 1 }, { pad: 1, bass: 1, sparkle: 1 }][p % 8];
}

function buildPass(p, isLast, n) {
  var v = p === 0 ? 0 : evolve / 100, L = layers(p, isLast), ev = [];
  strokeTracks(n).forEach(function (t) {
    var prev = null;
    for (var s = 0; s < n; s++) {
      var y = t.y[s];
      if (isNaN(y)) { prev = null; continue; }
      var str = strength(s), m = (s > 0 && !isNaN(t.y[s - 1])) ? Math.abs(y - t.y[s - 1]) : 0;
      var need = m < 0.35 ? 2 : m < 1.2 ? 1 : 0;
      var play = s === t.first || str >= need;
      if (v) {
        if (play && str <= 1 && s !== t.first && Math.random() < v * 0.35) play = false;
        else if (!play && Math.random() < v * 0.12) play = true;
      }
      if (L.thin && str < 2 && s !== t.first) play = false;
      if (!play) continue;
      var target = Math.max(LO, Math.min(HI, y));
      if (v && Math.random() < v * 0.6) target += (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3);
      var pp = choose(target, s, prev); prev = pp;
      if (!ev.some(function (e) { return e.s === s && e.p === pp && e.c === t.c; })) ev.push({ s: s, p: pp, c: t.c, vel: 0.6 + 0.1 * str });
    }
  });
  var per = {};
  ev = ev.filter(function (e) { per[e.s] = (per[e.s] || 0) + 1; return per[e.s] <= 5; });
  ev.forEach(function (e) { e.vel /= Math.sqrt(Math.min(per[e.s], 5)); });
  var byStep = {};
  ev.forEach(function (e) { (byStep[e.s] = byStep[e.s] || []).push(e); });
  return { byStep: byStep, L: L };
}

/* ---------- instruments ---------- */
function partials(c, dest, f, t, vel, list) {
  list.forEach(function (h) {
    var o = c.createOscillator(), g = c.createGain(), at = h[3] || 0.008;
    o.type = 'sine'; o.frequency.value = f * h[0];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(h[1] * 0.4 * vel, t + at);
    g.gain.exponentialRampToValueAtTime(0.0001, t + at + h[2]);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + at + h[2] + 0.05);
  });
}
function bellTone(c, d, f, t, v) { partials(c, d, f, t, v, [[1, 0.5, 2.4], [2, 0.15, 1.1], [3.01, 0.06, 0.5]]); }
function marimba(c, d, f, t, v)  { partials(c, d, f, t, v, [[1, 0.6, 0.55], [3.9, 0.12, 0.09], [9.2, 0.03, 0.03]]); }
function kalimba(c, d, f, t, v)  { partials(c, d, f, t, v, [[1, 0.55, 1.3], [5.95, 0.1, 0.12], [2, 0.05, 0.4]]); }
function glass(c, d, f, t, v)    { partials(c, d, f, t, v, [[1, 0.35, 2.8, 0.02], [2.76, 0.12, 1.3, 0.02], [5.4, 0.05, 0.6, 0.02]]); }
function musicBox(c, d, f, t, v) { partials(c, d, f, t, v, [[1, 0.4, 0.9], [3, 0.07, 0.3], [2, 0.05, 0.4]]); }
function bassTone(c, d, f, t, v) { partials(c, d, f, t, v, [[1, 0.75, 1.2, 0.01], [2, 0.12, 0.5, 0.01]]); }
function pluck(c, d, f, t, v) {
  var o = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain();
  o.type = 'sawtooth'; o.frequency.value = f;
  lp.type = 'lowpass'; lp.Q.value = 2;
  lp.frequency.setValueAtTime(Math.min(8000, f * 8), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(200, f * 1.2), t + 0.35);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.13 * v, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(lp); lp.connect(g); g.connect(d); o.start(t); o.stop(t + 0.95);
}
function flute(c, d, f, t, v) {
  var o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
  o.type = 'sine'; o.frequency.value = f;
  lfo.frequency.value = 5; lg.gain.value = 6; lfo.connect(lg); lg.connect(o.detune);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.2 * v, t + 0.08);
  g.gain.setValueAtTime(0.2 * v, t + 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
  o.connect(g); g.connect(d); o.start(t); lfo.start(t); o.stop(t + 1.05); lfo.stop(t + 1.05);
}
function epiano(c, d, f, t, v) {
  var car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain(), g = c.createGain();
  car.frequency.value = f; mod.frequency.value = f;
  mg.gain.setValueAtTime(f * 1.5, t);
  mg.gain.exponentialRampToValueAtTime(f * 0.05, t + 0.8);
  mod.connect(mg); mg.connect(car.frequency);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.2 * v, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  car.connect(g); g.connect(d); car.start(t); mod.start(t); car.stop(t + 1.65); mod.stop(t + 1.65);
}

/* ---------- backing and effects ---------- */
function buildChain(c) {
  var out = c.createGain(); out.connect(c.destination);
  var comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.connect(out);
  var len = Math.floor(c.sampleRate * 3), buf = c.createBuffer(2, len, c.sampleRate);
  for (var k = 0; k < 2; k++) { var dd = buf.getChannelData(k); for (var i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  var conv = c.createConvolver(); conv.buffer = buf;
  var wet = c.createGain(); wet.gain.value = 0.5; conv.connect(wet); wet.connect(comp);
  var dly = c.createDelay(4); dly.delayTime.value = stepDur() * 3;
  var fb = c.createGain(); fb.gain.value = echo / 100;
  var lead = c.createGain(); lead.gain.value = 0.5;
  lead.connect(comp); lead.connect(conv); lead.connect(dly);
  dly.connect(fb); fb.connect(dly); dly.connect(conv); dly.connect(comp);
  var padIn = c.createGain(); padIn.gain.value = 0.8; padIn.connect(comp); padIn.connect(conv);
  var bassIn = c.createGain(); bassIn.connect(comp);
  return { out: out, lead: lead, padIn: padIn, bassIn: bassIn, dly: dly, fb: fb };
}
function pad(c, dest, pcs, t, dur) {
  pcs.forEach(function (pc) {
    var f = mtof(voice(pc, 52));
    [-4, 4].forEach(function (det) {
      var o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
      o.type = 'triangle'; o.frequency.value = f; o.detune.value = det;
      lp.type = 'lowpass'; lp.frequency.value = 900;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.035, t + 0.9);
      g.gain.setValueAtTime(0.035, t + dur - 0.2);
      g.gain.linearRampToValueAtTime(0, t + dur + 1.2);
      o.connect(lp); lp.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 1.3);
    });
  });
}
function bass(c, dest, pc, t, vel) {
  var f = mtof(voice(pc, 38));
  [[1, 'sine', 0.28], [2, 'triangle', 0.05]].forEach(function (h) {
    var o = c.createOscillator(), g = c.createGain();
    o.type = h[1]; o.frequency.value = f * h[0];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(h[2] * vel, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 1.5);
  });
}
function scheduleStep(c, ch, cp, s, t) {
  var sd = stepDur(), L = cp.L;
  if (s % 16 === 0 && L.pad) pad(c, ch.padIn, chordAt(s), t, sd * 16);
  if (L.bass && (s % 16 === 0 || s % 16 === 8)) bass(c, ch.bassIn, chordAt(s)[0], t, s % 16 === 0 ? 1 : 0.7);
  (cp.byStep[s] || []).forEach(function (e) {
    var ins = INSTR[e.c];
    ins.play(c, ch.lead, mtof(e.p + ins.oct), t, e.vel);
    if (L.sparkle && strength(s) >= 3 && ins.oct >= 0) bellTone(c, ch.lead, mtof(e.p + 12), t + sd * 2, e.vel * 0.3);
  });
}
function scheduleEnding(c, ch, t) {
  pad(c, ch.padIn, mood.chords[0][1], t, 3);
  bellTone(c, ch.lead, mtof(voice(pcOf(mood.root), 62)), t, 0.8);
  bass(c, ch.bassIn, mood.chords[0][1][0], t, 1);
}
function initAudio() {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); chain = buildChain(ac); }
  ac.resume();
}

/* ---------- playback ---------- */
function scheduler() {
  while (nextTime < ac.currentTime + 0.2) {
    if (step === 0) {
      passSteps = songN;
      totalPasses = passesFor(passSteps);
      if (pass >= totalPasses) {
        if (!ended) { ended = true; scheduleEnding(ac, chain, nextTime); queue.push({ end: true, time: nextTime + 4 }); }
        return;
      }
      curPass = buildPass(pass, totalPasses > 2 && pass === totalPasses - 1, passSteps);
    }
    scheduleStep(ac, chain, curPass, step, nextTime);
    queue.push({ s: step, pass: pass, el: nextTime - schedStart, time: nextTime });
    step++; nextTime += stepDur();
    if (step >= passSteps) { step = 0; pass++; }
  }
}
function anim() {
  if (!playing) return;
  var now = ac.currentTime, moved = false;
  while (queue.length && queue[0].time <= now) {
    var q = queue.shift();
    if (q.end) { stopPlaying(); return; }
    if (q.s !== visStep) moved = true;
    visStep = q.s; visPass = q.pass; elapsed = q.el;
  }
  if (moved) {
    if ($('follow').checked && !drawing && !panning) {
      var w = cv.clientWidth, px = sx(visStep);
      if (px > w * 0.88 || px < 0) { camX = visStep - (w * 0.1) / scale(); clampCam(); renderLayer(); }
    }
    present(); updStatus();
  }
  requestAnimationFrame(anim);
}
function startPlaying() {
  if (!strokes.length) surprise();
  initAudio();
  chain.out.gain.cancelScheduledValues(ac.currentTime); chain.out.gain.setValueAtTime(1, ac.currentTime);
  chain.dly.delayTime.value = stepDur() * 3;
  playing = true; ended = false; pass = 0; step = 0; queue = []; visStep = -1;
  nextTime = ac.currentTime + 0.06; schedStart = nextTime;
  timerId = setInterval(scheduler, 25); scheduler();
  $('play').textContent = 'Stop';
  requestAnimationFrame(anim);
}
function stopPlaying() {
  playing = false; clearInterval(timerId); visStep = -1;
  $('play').textContent = 'Play';
  if (ac) {
    var t = ac.currentTime;
    chain.out.gain.cancelScheduledValues(t); chain.out.gain.setValueAtTime(chain.out.gain.value, t);
    chain.out.gain.linearRampToValueAtTime(0, t + 0.6);
  }
  updStatus(); present();
}
function updStatus() {
  var bars = songN / 16, tp = passesFor(songN);
  var tot = lengthSec ? fmt(tp * songN * stepDur()) : 'endless';
  var txt = (playing && visStep >= 0) ? ('Loop ' + (visPass + 1) + ' - ' + fmt(elapsed) + ' / ' + tot) : ('Song: ' + bars + ' bars - ' + tot);
  if (txt !== lastStatus) { $('status').textContent = txt; lastStatus = txt; }
}

/* ---------- view: pan and zoom ---------- */
function scale() { return zoom * BASE; }
function sx(wx) { return (wx - camX) * scale(); }
function sy(wy) { return TOP + (wy - camY) * scale(); }
function toWorld(sp) { var sc = scale(); return { x: Math.max(0, sp.x / sc + camX), y: Math.max(0, Math.min(PH, (sp.y - TOP) / sc + camY)) }; }
function clampCam() { camX = Math.max(-4, camX); camY = Math.max(-PH, Math.min(PH, camY)); }
function lineW() { return Math.max(1.5, Math.min(7, scale() * 0.22)); }
function zoomAt(sp, f) {
  var wb = { x: sp.x / scale() + camX, y: (sp.y - TOP) / scale() + camY };
  zoom = Math.max(0.12, Math.min(4, zoom * f));
  camX = wb.x - sp.x / scale(); camY = wb.y - (sp.y - TOP) / scale();
  clampCam(); renderLayer(); present();
}
function zoomCenter(f) { zoomAt({ x: cv.clientWidth / 2, y: cv.clientHeight / 2 }, f); }
function fitHeight() {
  var h = cv.clientHeight || 400;
  zoom = (h - TOP - 16) / (PH * BASE); camX = 0; camY = -8 / scale();
}
function fitAll() {
  var w = cv.clientWidth, h = cv.clientHeight;
  zoom = Math.max(0.12, Math.min((w - 20) / ((songN + 4) * BASE), (h - TOP - 16) / (PH * BASE)));
  camX = -2; camY = -((h - TOP) / scale() - PH) / 2;
  clampCam(); renderLayer(); present();
}

/* ---------- drawing the screen ---------- */
var hover = null;
function sizeCanvases() {
  var dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  var W = Math.round(w * dpr), Hh = Math.round(h * dpr);
  if (cv.width !== W || cv.height !== Hh) { cv.width = W; cv.height = Hh; }
  if (layer.width !== W || layer.height !== Hh) { layer.width = W; layer.height = Hh; }
  return { w: w, h: h, dpr: dpr };
}
function strokePath(L, st) {
  if (st.pts.length === 1) { L.beginPath(); L.arc(sx(st.pts[0].x), sy(st.pts[0].y), lineW() * 0.7, 0, 7); L.fill(); return; }
  L.beginPath();
  for (var j = 0; j < st.pts.length; j++) { var x = sx(st.pts[j].x), y = sy(st.pts[j].y); if (j) L.lineTo(x, y); else L.moveTo(x, y); }
  L.stroke();
}
function renderLayer() {
  var d = sizeCanvases(), w = d.w, h = d.h, L = lctx;
  if (!w || !h) return;
  L.setTransform(d.dpr, 0, 0, d.dpr, 0, 0);
  L.fillStyle = '#efebe2'; L.fillRect(0, 0, w, h);
  var sc = scale(), y0 = sy(0), y1 = sy(PH), x0 = Math.max(0, sx(0));
  L.fillStyle = '#fffdf8'; L.fillRect(x0, y0, w - x0, y1 - y0);
  var a = Math.max(0, Math.floor(camX)), b = Math.ceil(camX + w / sc);
  if (showGrid) {
    var every = sc * 4 >= 10 ? 4 : sc * 16 >= 10 ? 16 : 64;
    for (var s = Math.ceil(a / every) * every; s <= b; s += every) {
      L.fillStyle = s % 16 === 0 ? 'rgba(0,0,0,0.08)' : 'rgba(0,0,0,0.03)';
      L.fillRect(sx(s), y0, 1, y1 - y0);
    }
    scalePitches.forEach(function (p) {
      if (p < LO || p > HI) return;
      var yy = sy((1 - (p - LO) / (HI - LO)) * PH);
      L.fillStyle = pcOf(p) === pcOf(mood.root) ? 'rgba(0,0,0,0.07)' : 'rgba(0,0,0,0.03)';
      L.fillRect(x0, yy, w - x0, 1);
    });
  }
  var ex = sx(songN);
  if (ex > -2 && ex < w + 2) {
    L.strokeStyle = 'rgba(216,90,48,0.5)'; L.lineWidth = 1.5; L.setLineDash([5, 5]);
    L.beginPath(); L.moveTo(ex, y0); L.lineTo(ex, y1); L.stroke(); L.setLineDash([]);
  }
  L.lineCap = 'round'; L.lineJoin = 'round'; L.lineWidth = lineW();
  strokes.forEach(function (st) { L.strokeStyle = INSTR[st.c].color; L.fillStyle = INSTR[st.c].color; strokePath(L, st); });
  L.fillStyle = '#faf8f3'; L.fillRect(0, 0, w, TOP);
  if (sc * 16 >= 28) {
    L.font = '12px system-ui, sans-serif'; L.fillStyle = '#999';
    for (var bar = Math.floor(a / 16); bar * 16 <= b; bar++) L.fillText(mood.chords[bar % 4][0], sx(bar * 16) + 6, 16);
  }
  if (!strokes.length) {
    L.fillStyle = '#bbb'; L.font = '16px system-ui, sans-serif'; L.textAlign = 'center';
    L.fillText('Pick a color and draw anything', w / 2, (y0 + y1) / 2); L.textAlign = 'left';
  }
}
function drawSeg(a, b, col) {
  var dpr = window.devicePixelRatio || 1, L = lctx;
  L.setTransform(dpr, 0, 0, dpr, 0, 0);
  L.strokeStyle = col; L.lineWidth = lineW(); L.lineCap = 'round';
  L.beginPath(); L.moveTo(sx(a.x), sy(a.y)); L.lineTo(sx(b.x), sy(b.y)); L.stroke();
}
function present() {
  var dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(layer, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (playing && visStep >= 0) { ctx.fillStyle = 'rgba(216,90,48,0.7)'; ctx.fillRect(sx(visStep), sy(0), 2, sy(PH) - sy(0)); }
  if (tool === 'erase' && hover && !panning) { ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(hover.x, hover.y, 16, 0, 7); ctx.stroke(); }
}
function refresh() {
  songN = calcSong();
  if (playing && curPass) curPass = buildPass(pass, totalPasses > 2 && pass === totalPasses - 1, passSteps);
  renderLayer(); present(); updStatus();
}

/* ---------- undo / redo ---------- */
function pushUndo() { undoStack.push(strokes.slice()); if (undoStack.length > 100) undoStack.shift(); redoStack = []; }
function undo() { if (!undoStack.length) return; redoStack.push(strokes.slice()); strokes = undoStack.pop(); refresh(); }
function redo() { if (!redoStack.length) return; undoStack.push(strokes.slice()); strokes = redoStack.pop(); refresh(); }

/* ---------- pen, eraser, move ---------- */
var drawing = null, erasing = false, panning = null, lastPrevStep = -1;
function screenPt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function previewNote(wp) {
  var s = Math.floor(wp.x);
  if (s === lastPrevStep) return;
  lastPrevStep = s;
  var ins = INSTR[curColor], p = choose(pitchOfY(wp.y), s, null);
  ins.play(ac, chain.lead, mtof(p + ins.oct), ac.currentTime, playing ? 0.3 : 0.5);
}
function eraseAt(wp) {
  var R = 16 / scale(), changed = false, out = [];
  strokes.forEach(function (st) {
    var run = [], hit = false;
    st.pts.forEach(function (q) {
      var dx = q.x - wp.x, dy = q.y - wp.y;
      if (dx * dx + dy * dy < R * R) { hit = true; if (run.length) out.push({ c: st.c, pts: run }); run = []; }
      else run.push(q);
    });
    if (!hit) { out.push(st); return; }
    changed = true;
    if (run.length) out.push({ c: st.c, pts: run });
  });
  if (changed) { strokes = out; renderLayer(); }
}
function updCursor() { cv.style.cursor = panning ? 'grabbing' : (tool === 'move' || spaceDown) ? 'grab' : 'crosshair'; }
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  var sp = screenPt(e);
  if (tool === 'move' || spaceDown || e.button === 1) { panning = { sx: sp.x, sy: sp.y, cx: camX, cy: camY }; updCursor(); return; }
  if (e.button !== 0) return;
  initAudio(); pushUndo();
  var wp = toWorld(sp);
  if (tool === 'erase') { erasing = true; eraseAt(wp); present(); return; }
  drawing = { c: curColor, pts: [wp] }; strokes.push(drawing); lastPrevStep = -1;
  lctx.fillStyle = INSTR[curColor].color; strokePath(lctx, drawing);
  previewNote(wp); present();
});
cv.addEventListener('pointermove', function (e) {
  var sp = screenPt(e); hover = sp;
  if (panning) {
    var sc = scale();
    camX = panning.cx - (sp.x - panning.sx) / sc; camY = panning.cy - (sp.y - panning.sy) / sc;
    clampCam(); renderLayer(); present(); return;
  }
  if (erasing) { eraseAt(toWorld(sp)); present(); return; }
  if (!drawing) { if (tool === 'erase') present(); return; }
  var p = toWorld(sp), q = drawing.pts[drawing.pts.length - 1];
  var n = Math.ceil(Math.hypot(p.x - q.x, p.y - q.y) / 0.15);
  for (var i = 1; i <= n; i++) drawing.pts.push({ x: q.x + (p.x - q.x) * i / n, y: q.y + (p.y - q.y) * i / n });
  drawSeg(q, p, INSTR[drawing.c].color);
  previewNote(p); present();
});
function endPointer() {
  if (panning) { panning = null; updCursor(); return; }
  if (erasing) { erasing = false; refresh(); return; }
  if (drawing) { drawing = null; refresh(); }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', function () { hover = null; if (tool === 'erase') present(); });
cv.addEventListener('wheel', function (e) {
  e.preventDefault();
  var sp = screenPt(e);
  if (e.ctrlKey || e.metaKey) zoomAt(sp, Math.exp(-e.deltaY * 0.01));
  else if (e.shiftKey) { camX += e.deltaY / scale(); clampCam(); renderLayer(); present(); }
  else if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { camX += e.deltaX / scale(); clampCam(); renderLayer(); present(); }
  else zoomAt(sp, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });
document.addEventListener('keydown', function (e) {
  var tag = (e.target.tagName || '').toLowerCase();
  if (e.code === 'Space' && tag !== 'input' && tag !== 'select') { e.preventDefault(); if (!spaceDown) { spaceDown = true; updCursor(); } return; }
  if (!(e.ctrlKey || e.metaKey)) return;
  var k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
});
document.addEventListener('keyup', function (e) { if (e.code === 'Space') { spaceDown = false; updCursor(); } });

function surprise() {
  pushUndo(); strokes = [];
  var picks = [0, 2, 3, 6, 8];
  for (var k = 0; k < 4; k++) {
    var a = 0.01 + k * 0.25, b = a + 0.225, c = picks[Math.floor(Math.random() * picks.length)];
    var ph = [Math.random() * 6, Math.random() * 6, Math.random() * 6], pts = [];
    for (var x = a; x <= b; x += 0.003) {
      var y = 0.4 + 0.16 * Math.sin(x * 9 + ph[0]) + 0.1 * Math.sin(x * 23 + ph[1]) * (k % 2 ? 1.4 : 0.6) + 0.04 * Math.sin(x * 61 + ph[2]);
      pts.push({ x: x * 64, y: Math.max(0.05, Math.min(0.75, y)) * PH });
    }
    strokes.push({ c: c, pts: pts });
  }
  var bpts = [], bph = Math.random() * 6;
  for (var bx = 0.01; bx <= 0.98; bx += 0.003) bpts.push({ x: bx * 64, y: (0.85 + 0.05 * Math.sin(bx * 6 + bph)) * PH });
  strokes.push({ c: 7, pts: bpts });
  refresh();
}

/* ---------- toolbar ---------- */
INSTR.forEach(function (ins, i) {
  var b = document.createElement('button');
  b.className = 'sw' + (i === curColor ? ' on' : '');
  b.style.background = ins.color; b.title = ins.name;
  b.onclick = function () {
    curColor = i; setTool('pen');
    document.querySelectorAll('.sw').forEach(function (el, j) { el.classList.toggle('on', j === i); });
    $('instName').textContent = 'Sound: ' + ins.name;
    initAudio(); ins.play(ac, chain.lead, mtof(69 + ins.oct), ac.currentTime, 0.5);
  };
  $('palette').appendChild(b);
});
$('instName').textContent = 'Sound: ' + INSTR[curColor].name;
function setTool(t) {
  tool = t;
  $('tPen').classList.toggle('on', t === 'pen');
  $('tErase').classList.toggle('on', t === 'erase');
  $('tMove').classList.toggle('on', t === 'move');
  updCursor(); present();
}
$('tPen').onclick = function () { setTool('pen'); };
$('tErase').onclick = function () { setTool('erase'); };
$('tMove').onclick = function () { setTool('move'); };
$('tUndo').onclick = undo;
$('tRedo').onclick = redo;
$('tClear').onclick = function () { if (!strokes.length) return; pushUndo(); strokes = []; refresh(); };
$('tShuffle').onclick = surprise;
$('tZoomIn').onclick = function () { zoomCenter(1.25); };
$('tZoomOut').onclick = function () { zoomCenter(0.8); };
$('tFit').onclick = fitAll;
$('tGrid').onclick = function () { showGrid = !showGrid; $('tGrid').classList.toggle('on', showGrid); renderLayer(); present(); };

/* ---------- header controls ---------- */
$('play').onclick = function () { if (playing) stopPlaying(); else startPlaying(); };
$('mood').onchange = function (e) { setMood(e.target.value); };
$('tempo').oninput = function (e) { bpm = +e.target.value; $('bpm').textContent = bpm; if (chain) chain.dly.delayTime.value = stepDur() * 3; updStatus(); };
$('evolve').oninput = function (e) { evolve = +e.target.value; };
$('echo').oninput = function (e) { echo = +e.target.value; if (chain) chain.fb.gain.value = echo / 100; };
$('len').onchange = function (e) { lengthSec = +e.target.value; updStatus(); };
$('backing').onchange = function (e) { backing = e.target.checked; refresh(); };
$('save').onclick = function () {
  localStorage.setItem('drawingInstrument4', JSON.stringify({ strokes: strokes, mood: $('mood').value, bpm: bpm, evolve: evolve, echo: echo, lengthSec: lengthSec, backing: backing }));
  alert('Saved in this browser');
};
$('load').onclick = function () {
  var d = JSON.parse(localStorage.getItem('drawingInstrument4') || 'null');
  if (!d) { alert('Nothing saved yet'); return; }
  pushUndo();
  strokes = d.strokes; bpm = d.bpm; evolve = d.evolve; echo = d.echo; lengthSec = d.lengthSec; backing = d.backing;
  $('mood').value = d.mood; $('tempo').value = bpm; $('bpm').textContent = bpm; $('evolve').value = evolve;
  $('echo').value = echo; $('len').value = lengthSec; $('backing').checked = backing;
  if (chain) { chain.fb.gain.value = echo / 100; chain.dly.delayTime.value = stepDur() * 3; }
  setMood(d.mood); fitAll();
};
$('wav').onclick = function () {
  if (!strokes.length) { alert('Draw something first'); return; }
  var btn = $('wav'); btn.textContent = 'Rendering...'; btn.disabled = true;
  var sd = stepDur(), n = songN, tp = Math.max(1, Math.round((lengthSec || 300) / (n * sd)));
  var dur = tp * n * sd + 5, oc = new OfflineAudioContext(2, Math.ceil(44100 * dur), 44100), ch = buildChain(oc);
  for (var p = 0; p < tp; p++) {
    var cp = buildPass(p, tp > 2 && p === tp - 1, n);
    for (var s = 0; s < n; s++) scheduleStep(oc, ch, cp, s, 0.05 + (p * n + s) * sd);
  }
  scheduleEnding(oc, ch, 0.05 + tp * n * sd);
  oc.startRendering().then(function (buf) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(encodeWav(buf)); a.download = 'my-piece.wav'; a.click();
  }).finally(function () { btn.textContent = 'Export WAV'; btn.disabled = false; });
};
function encodeWav(b) {
  var n = b.length, dv = new DataView(new ArrayBuffer(44 + n * 4));
  function w(o, s) { for (var i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); }
  w(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, b.sampleRate, true); dv.setUint32(28, b.sampleRate * 4, true);
  dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, n * 4, true);
  var L = b.getChannelData(0), R = b.getChannelData(1), o = 44;
  for (var i = 0; i < n; i++) {
    dv.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 32767, true); o += 2;
    dv.setInt16(o, Math.max(-1, Math.min(1, R[i])) * 32767, true); o += 2;
  }
  return new Blob([dv], { type: 'audio/wav' });
}

window.addEventListener('resize', function () { renderLayer(); present(); });
fitHeight();
setMood('calm');
updStatus();

});
</script>
</body>
</html>
