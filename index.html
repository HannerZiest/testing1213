<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawing instrument</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #faf8f3; color: #2c2c2a; }
  header { padding: 16px 20px 8px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  button, select { font: inherit; font-size: 14px; padding: 6px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
  button:hover { background: #f1efe8; }
  label { font-size: 13px; color: #666; display: flex; gap: 6px; align-items: center; }
  #play { min-width: 80px; font-weight: 500; }
  #status { font-variant-numeric: tabular-nums; font-size: 14px; min-width: 170px; }
  #wrap { margin: 8px 20px; }
  #cv { display: block; width: 100%; height: 380px; border-radius: 12px; background: #f1efe8; cursor: crosshair; touch-action: none; }
  #err { display: none; margin: 12px 20px 0; padding: 10px 14px; border-radius: 8px; background: #fcebeb; color: #791f1f; font-size: 14px; }
  .hint { margin: 10px 20px; font-size: 13px; color: #888; }
</style>
<script>
  window.onerror = function (msg, src, line) {
    var e = document.getElementById('err');
    if (e) { e.style.display = 'block'; e.textContent = 'Something went wrong: ' + msg + ' (line ' + line + ')'; }
  };
</script>
</head>
<body>
<div id="err"></div>
<header>
  <button id="play">Play</button>
  <span id="status">Loading...</span>
  <label>Mood
    <select id="mood">
      <option value="calm">Calm</option>
      <option value="dreamy">Dreamy</option>
      <option value="warm">Warm</option>
    </select>
  </label>
  <label>Tempo <input type="range" id="tempo" min="56" max="110" step="1" value="76"> <span id="bpm">76</span></label>
  <label>Evolve <input type="range" id="evolve" min="0" max="80" step="1" value="30"></label>
  <label>Echo <input type="range" id="echo" min="0" max="55" step="1" value="30"></label>
  <label>Length
    <select id="len">
      <option value="60">1 min</option>
      <option value="120">2 min</option>
      <option value="180">3 min</option>
      <option value="300" selected>5 min</option>
      <option value="0">Endless</option>
    </select>
  </label>
  <label><input type="checkbox" id="backing" checked> Backing</label>
  <button id="rand">Surprise me</button>
  <button id="undo">Undo</button>
  <button id="clear">Clear</button>
  <button id="save">Save</button>
  <button id="load">Load</button>
  <button id="wav">Export WAV</button>
</header>

<div id="wrap"><canvas id="cv"></canvas></div>
<p class="hint">Draw lines anywhere. Higher means higher notes. Flat lines play slowly, wiggly lines play fast. Your drawing loops, and "Evolve" lets it slowly change each time around.</p>

<script>
window.addEventListener('load', function () {

var STEPS = 64, LO = 57, HI = 86, TOP = 24;
var MOODS = {
  calm:   { root: 2, scale: [0, 3, 5, 7, 10], chords: [['Dm', [2, 5, 9]], ['Bb', [10, 2, 5]], ['F', [5, 9, 0]], ['C', [0, 4, 7]]] },
  dreamy: { root: 2, scale: [0, 2, 4, 7, 9],  chords: [['D', [2, 6, 9]], ['Bm', [11, 2, 6]], ['G', [7, 11, 2]], ['A', [9, 1, 4]]] },
  warm:   { root: 7, scale: [0, 2, 4, 7, 9],  chords: [['G', [7, 11, 2]], ['Em', [4, 7, 11]], ['C', [0, 4, 7]], ['D', [2, 6, 9]]] }
};
var DEG_COLORS = ['#D85A30', '#BA7517', '#1D9E75', '#378ADD', '#7F77DD', '#D4537E', '#639922'];
function $(id) { return document.getElementById(id); }
var cv = $('cv'), ctx = cv.getContext('2d');

var mood = MOODS.calm, scalePitches = [], strokes = [], preview = null;
var bpm = 76, evolve = 30, echo = 30, lengthSec = 300, backing = true;
var ac = null, chain = null, playing = false, ended = false, timerId = null;
var gs = 0, nextTime = 0, curPass = null, curPassIdx = -1, queue = [], visStep = -1, visPass = 0, elapsed = 0, totalPasses = Infinity;

function stepDur() { return 60 / bpm / 4; }
function passDur() { return STEPS * stepDur(); }
function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function pcOf(p) { return ((p % 12) + 12) % 12; }
function fmt(s) { return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
function strength(s) { return s % 16 === 0 ? 4 : s % 8 === 0 ? 3 : s % 4 === 0 ? 2 : s % 2 === 0 ? 1 : 0; }
function chordAt(s) { return mood.chords[Math.floor(s / 16) % 4][1]; }
function noteColor(p) { return DEG_COLORS[Math.max(0, mood.scale.indexOf(pcOf(p - mood.root))) % 7]; }
function voice(pc, lo) { var m = lo; while (pcOf(m) !== pc) m++; return m; }

function setMood(k) {
  mood = MOODS[k]; scalePitches = [];
  for (var p = LO - 7; p <= HI + 7; p++) if (mood.scale.indexOf(pcOf(p - mood.root)) >= 0) scalePitches.push(p);
  refresh();
}

/* turning drawings into notes */
function strokeTracks() {
  return strokes.map(function (st) {
    var sum = new Float64Array(STEPS), cnt = new Uint16Array(STEPS), first = -1;
    for (var i = 0; i < st.length; i++) {
      var s = Math.min(STEPS - 1, Math.floor(st[i].x * STEPS));
      if (first < 0) first = s;
      sum[s] += LO + (1 - st[i].y) * (HI - LO); cnt[s]++;
    }
    var y = [];
    for (var k = 0; k < STEPS; k++) y.push(cnt[k] ? sum[k] / cnt[k] : NaN);
    return { y: y, first: first };
  });
}

function choose(target, s, prev) {
  var pcs = chordAt(s), wH = [0, 0.3, 0.7, 1.4, 2.2][strength(s)];
  var best = Math.round(target), bs = -1e9;
  for (var i = 0; i < scalePitches.length; i++) {
    var p = scalePitches[i];
    if (p < LO - 2 || p > HI + 2 || Math.abs(p - target) > 6) continue;
    var d = p - target, sc = -(d * d) / 5, pc = pcOf(p);
    if (pcs.indexOf(pc) >= 0) sc += wH;
    else if (pcs.some(function (c) { var iv = pcOf(pc - c); return iv === 1 || iv === 11 || iv === 6; })) sc -= wH * 0.8;
    if (prev !== null) { var l = Math.abs(p - prev); if (l > 7) sc -= 0.08 * (l - 7) * (l - 7); if (l === 0) sc -= 0.25; }
    sc += Math.random() * 0.35;
    if (sc > bs) { bs = sc; best = p; }
  }
  return best;
}

function layers(pass, total) {
  if (!backing) return {};
  if (total > 2 && pass === total - 1) return { pad: 1, thin: 1 };
  return [{ pad: 1 }, { pad: 1, bass: 1 }, { pad: 1, bass: 1 }, { pad: 1, bass: 1, sparkle: 1 },
          { pad: 1, bass: 1, sparkle: 1 }, { pad: 1, thin: 1 }, { pad: 1, bass: 1 }, { pad: 1, bass: 1, sparkle: 1 }][pass % 8];
}

function buildPass(pass, total) {
  var v = pass === 0 ? 0 : evolve / 100, L = layers(pass, total), ev = [];
  strokeTracks().forEach(function (t) {
    var prev = null;
    for (var s = 0; s < STEPS; s++) {
      var y = t.y[s];
      if (isNaN(y)) { prev = null; continue; }
      var str = strength(s), m = (s > 0 && !isNaN(t.y[s - 1])) ? Math.abs(y - t.y[s - 1]) : 0;
      var need = m < 0.35 ? 2 : m < 1.2 ? 1 : 0;
      var play = s === t.first || str >= need;
      if (v) {
        if (play && str <= 1 && s !== t.first && Math.random() < v * 0.35) play = false;
        else if (!play && Math.random() < v * 0.12) play = true;
      }
      if (L.thin && str < 2 && s !== t.first) play = false;
      if (!play) continue;
      var target = Math.max(LO, Math.min(HI, y));
      if (v && Math.random() < v * 0.6) target += (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3);
      var p = choose(target, s, prev); prev = p;
      if (!ev.some(function (e) { return e.s === s && e.p === p; })) ev.push({ s: s, p: p, vel: 0.6 + 0.1 * str });
    }
  });
  return { ev: ev, L: L };
}

/* sound */
function buildChain(c) {
  var out = c.createGain(); out.connect(c.destination);
  var comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.connect(out);
  var len = Math.floor(c.sampleRate * 3), buf = c.createBuffer(2, len, c.sampleRate);
  for (var k = 0; k < 2; k++) { var d = buf.getChannelData(k); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  var conv = c.createConvolver(); conv.buffer = buf;
  var wet = c.createGain(); wet.gain.value = 0.5; conv.connect(wet); wet.connect(comp);
  var dly = c.createDelay(4); dly.delayTime.value = stepDur() * 3;
  var fb = c.createGain(); fb.gain.value = echo / 100;
  var lead = c.createGain(); lead.gain.value = 0.5;
  lead.connect(comp); lead.connect(conv); lead.connect(dly);
  dly.connect(fb); fb.connect(dly); dly.connect(conv); dly.connect(comp);
  var padIn = c.createGain(); padIn.connect(comp); padIn.connect(conv);
  var bassIn = c.createGain(); bassIn.connect(comp);
  return { out: out, lead: lead, padIn: padIn, bassIn: bassIn, dly: dly, fb: fb };
}

function bell(c, dest, f, t, vel) {
  [[1, 0.5, 2.4], [2, 0.15, 1.1], [3.01, 0.06, 0.5]].forEach(function (h) {
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f * h[0];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(h[1] * 0.4 * vel, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + h[2]);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + h[2] + 0.05);
  });
}

function pad(c, dest, pcs, t, dur) {
  pcs.forEach(function (pc) {
    var f = mtof(voice(pc, 52));
    [-4, 4].forEach(function (det) {
      var o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
      o.type = 'triangle'; o.frequency.value = f; o.detune.value = det;
      lp.type = 'lowpass'; lp.frequency.value = 900;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.035, t + 0.9);
      g.gain.setValueAtTime(0.035, t + dur - 0.2);
      g.gain.linearRampToValueAtTime(0, t + dur + 1.2);
      o.connect(lp); lp.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 1.3);
    });
  });
}

function bass(c, dest, pc, t, vel) {
  var f = mtof(voice(pc, 38));
  [[1, 'sine', 0.28], [2, 'triangle', 0.05]].forEach(function (h) {
    var o = c.createOscillator(), g = c.createGain();
    o.type = h[1]; o.frequency.value = f * h[0];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(h[2] * vel, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 1.5);
  });
}

function scheduleStep(c, ch, cp, s, t) {
  var sd = stepDur(), L = cp.L;
  if (s % 16 === 0 && L.pad) pad(c, ch.padIn, chordAt(s), t, sd * 16);
  if (L.bass && (s % 16 === 0 || s % 16 === 8)) bass(c, ch.bassIn, chordAt(s)[0], t, s % 16 === 0 ? 1 : 0.7);
  cp.ev.forEach(function (e) {
    if (e.s !== s) return;
    bell(c, ch.lead, mtof(e.p), t, e.vel);
    if (L.sparkle && strength(s) >= 3) bell(c, ch.lead, mtof(e.p + 12), t + sd * 2, e.vel * 0.35);
  });
}

function scheduleEnding(c, ch, t) {
  pad(c, ch.padIn, mood.chords[0][1], t, 3);
  bell(c, ch.lead, mtof(voice(pcOf(mood.root), 62)), t, 0.8);
  bass(c, ch.bassIn, mood.chords[0][1][0], t, 1);
}

function initAudio() {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); chain = buildChain(ac); }
  ac.resume();
}

/* playback */
function computeTotal() { return lengthSec ? Math.max(1, Math.round(lengthSec / passDur())) : Infinity; }

function scheduler() {
  while (nextTime < ac.currentTime + 0.2) {
    if (gs >= totalPasses * STEPS) {
      if (!ended) { ended = true; scheduleEnding(ac, chain, nextTime); queue.push({ end: true, time: nextTime + 4 }); }
      return;
    }
    var s = gs % STEPS, pass = Math.floor(gs / STEPS);
    if (s === 0 || !curPass || curPassIdx !== pass) { curPass = buildPass(pass, totalPasses); curPassIdx = pass; }
    scheduleStep(ac, chain, curPass, s, nextTime);
    queue.push({ s: s, pass: pass, gs: gs, time: nextTime });
    gs++; nextTime += stepDur();
  }
}

function anim() {
  if (!playing) return;
  var now = ac.currentTime;
  while (queue.length && queue[0].time <= now) {
    var q = queue.shift();
    if (q.end) { stopPlaying(); return; }
    visStep = q.s; visPass = q.pass; elapsed = q.gs * stepDur();
  }
  updStatus(); draw(); requestAnimationFrame(anim);
}

function startPlaying() {
  if (!strokes.length) surprise();
  initAudio();
  chain.out.gain.cancelScheduledValues(ac.currentTime); chain.out.gain.setValueAtTime(1, ac.currentTime);
  chain.dly.delayTime.value = stepDur() * 3;
  totalPasses = computeTotal();
  playing = true; ended = false; gs = 0; curPass = null; curPassIdx = -1; queue = [];
  nextTime = ac.currentTime + 0.06;
  timerId = setInterval(scheduler, 25); scheduler();
  $('play').textContent = 'Stop';
  requestAnimationFrame(anim);
}

function stopPlaying() {
  playing = false; clearInterval(timerId); visStep = -1;
  $('play').textContent = 'Play';
  if (ac) {
    var t = ac.currentTime;
    chain.out.gain.cancelScheduledValues(t); chain.out.gain.setValueAtTime(chain.out.gain.value, t);
    chain.out.gain.linearRampToValueAtTime(0, t + 0.6);
  }
  updStatus(); draw();
}

function updStatus() {
  var tot = lengthSec ? fmt(computeTotal() * passDur()) : 'endless';
  $('status').textContent = (playing && visStep >= 0) ? ('Loop ' + (visPass + 1) + ' - ' + fmt(elapsed) + ' / ' + tot) : ('Ready - ' + tot);
}

/* drawing the screen */
function draw() {
  var dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  var H = h - TOP;
  function yOf(p) { return TOP + (1 - (p - LO) / (HI - LO)) * H; }
  function xOf(s) { return (s + 0.5) / STEPS * w; }
  ctx.font = '12px system-ui, sans-serif';
  for (var b = 0; b < 4; b++) {
    if (b % 2) { ctx.fillStyle = 'rgba(0,0,0,0.025)'; ctx.fillRect(b * w / 4, 0, w / 4, h); }
    ctx.fillStyle = '#888'; ctx.fillText(mood.chords[b][0], b * w / 4 + 8, 16);
  }
  for (var s = 0; s < STEPS; s += 4) { ctx.fillStyle = s % 16 === 0 ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.05)'; ctx.fillRect(s / STEPS * w, TOP, 1, H); }
  scalePitches.forEach(function (p) {
    if (p < LO || p > HI) return;
    ctx.fillStyle = pcOf(p) === pcOf(mood.root) ? 'rgba(0,0,0,0.09)' : 'rgba(0,0,0,0.035)';
    ctx.fillRect(0, yOf(p), w, 1);
  });
  if (!strokes.length) {
    ctx.fillStyle = '#aaa'; ctx.font = '15px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Draw a line here', w / 2, h / 2); ctx.textAlign = 'left';
  }
  ctx.strokeStyle = 'rgba(83,74,183,0.22)'; ctx.fillStyle = 'rgba(83,74,183,0.22)';
  ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  strokes.forEach(function (st) {
    if (st.length === 1) { ctx.beginPath(); ctx.arc(st[0].x * w, TOP + st[0].y * H, 3, 0, 7); ctx.fill(); return; }
    ctx.beginPath();
    st.forEach(function (pt, j) { var x = pt.x * w, y = TOP + pt.y * H; if (j) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
    ctx.stroke();
  });
  var cp = (playing && curPass) ? curPass : preview;
  if (cp) cp.ev.forEach(function (e) {
    var hit = playing && e.s === visStep;
    ctx.fillStyle = noteColor(e.p); ctx.beginPath(); ctx.arc(xOf(e.s), yOf(e.p), hit ? 9 : 5, 0, 7); ctx.fill();
  });
  if (playing && visStep >= 0) { ctx.fillStyle = '#D85A30'; ctx.fillRect(visStep / STEPS * w, TOP, 2, H); }
}

function refresh() {
  preview = buildPass(0, Infinity);
  if (playing && curPassIdx >= 0) curPass = buildPass(curPassIdx, totalPasses);
  draw();
}

/* input */
var drawing = null, lastPrevStep = -1;
function ptFrom(e) {
  var r = cv.getBoundingClientRect();
  return { x: Math.max(0, Math.min(0.9999, (e.clientX - r.left) / r.width)), y: Math.max(0, Math.min(1, (e.clientY - r.top - TOP) / (r.height - TOP))) };
}
function previewNote(pt) {
  var s = Math.floor(pt.x * STEPS);
  if (s === lastPrevStep) return;
  lastPrevStep = s;
  var p = choose(LO + (1 - pt.y) * (HI - LO), s, null);
  bell(ac, chain.lead, mtof(p), ac.currentTime, playing ? 0.3 : 0.5);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  initAudio();
  drawing = [ptFrom(e)]; strokes.push(drawing); lastPrevStep = -1;
  previewNote(drawing[0]); draw();
});
cv.addEventListener('pointermove', function (e) {
  if (!drawing) return;
  var p = ptFrom(e), q = drawing[drawing.length - 1];
  var n = Math.ceil(Math.hypot(p.x - q.x, p.y - q.y) / 0.004);
  for (var i = 1; i <= n; i++) drawing.push({ x: q.x + (p.x - q.x) * i / n, y: q.y + (p.y - q.y) * i / n });
  previewNote(p); draw();
});
function endStroke() { if (drawing) { drawing = null; refresh(); } }
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

function surprise() {
  strokes = [];
  var ph = [Math.random() * 6, Math.random() * 6, Math.random() * 6];
  [[0.01, 0.235], [0.26, 0.485], [0.51, 0.735], [0.76, 0.97]].forEach(function (seg, k) {
    var st = [];
    for (var x = seg[0]; x <= seg[1]; x += 0.003) {
      var y = 0.5 + 0.18 * Math.sin(x * 9 + ph[0]) + 0.1 * Math.sin(x * 23 + ph[1]) * (k % 2 ? 1.4 : 0.6) + 0.05 * Math.sin(x * 61 + ph[2]);
      st.push({ x: x, y: Math.max(0.05, Math.min(0.95, y)) });
    }
    strokes.push(st);
  });
  refresh();
}

/* controls */
$('play').onclick = function () { if (playing) stopPlaying(); else startPlaying(); };
$('mood').onchange = function (e) { setMood(e.target.value); };
$('tempo').oninput = function (e) { bpm = +e.target.value; $('bpm').textContent = bpm; if (chain) chain.dly.delayTime.value = stepDur() * 3; updStatus(); };
$('evolve').oninput = function (e) { evolve = +e.target.value; };
$('echo').oninput = function (e) { echo = +e.target.value; if (chain) chain.fb.gain.value = echo / 100; };
$('len').onchange = function (e) { lengthSec = +e.target.value; if (playing) totalPasses = Math.max(computeTotal(), curPassIdx + 1); updStatus(); };
$('backing').onchange = function (e) { backing = e.target.checked; refresh(); };
$('rand').onclick = surprise;
$('undo').onclick = function () { strokes.pop(); refresh(); };
$('clear').onclick = function () { strokes = []; refresh(); };
$('save').onclick = function () {
  localStorage.setItem('drawingInstrument2', JSON.stringify({ strokes: strokes, mood: $('mood').value, bpm: bpm, evolve: evolve, echo: echo, lengthSec: lengthSec, backing: backing }));
  alert('Saved in this browser');
};
$('load').onclick = function () {
  var d = JSON.parse(localStorage.getItem('drawingInstrument2') || 'null');
  if (!d) { alert('Nothing saved yet'); return; }
  strokes = d.strokes; bpm = d.bpm; evolve = d.evolve; echo = d.echo; lengthSec = d.lengthSec; backing = d.backing;
  $('mood').value = d.mood; $('tempo').value = bpm; $('bpm').textContent = bpm; $('evolve').value = evolve;
  $('echo').value = echo; $('len').value = lengthSec; $('backing').checked = backing;
  if (chain) { chain.fb.gain.value = echo / 100; chain.dly.delayTime.value = stepDur() * 3; }
  setMood(d.mood); updStatus();
};

$('wav').onclick = function () {
  if (!strokes.length) { alert('Draw something first'); return; }
  var btn = $('wav'); btn.textContent = 'Rendering...'; btn.disabled = true;
  var sd = stepDur(), total = Math.max(1, Math.round((lengthSec || 300) / passDur()));
  var dur = total * passDur() + 5, oc = new OfflineAudioContext(2, Math.ceil(44100 * dur), 44100), ch = buildChain(oc), cp = null;
  for (var g = 0; g < total * STEPS; g++) {
    var s = g % STEPS;
    if (s === 0) cp = buildPass(Math.floor(g / STEPS), total);
    scheduleStep(oc, ch, cp, s, 0.05 + g * sd);
  }
  scheduleEnding(oc, ch, 0.05 + total * STEPS * sd);
  oc.startRendering().then(function (buf) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(encodeWav(buf)); a.download = 'my-piece.wav'; a.click();
  }).finally(function () { btn.textContent = 'Export WAV'; btn.disabled = false; });
};

function encodeWav(b) {
  var n = b.length, dv = new DataView(new ArrayBuffer(44 + n * 4));
  function w(o, s) { for (var i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); }
  w(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt ');
